<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Flashcard App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="auth-screen">
        <h1>Flashcard App</h1>

        <div id="auth-form">
            <input type="email" id="email-input" placeholder="Email">
            <input type="password" id="password-input" placeholder="Password">
            <button id="login-btn">Log In</button>
            <button id="register-btn">Register</button>
            <p id="auth-error"></p>
        </div>
    </div>

    <div id="app-screen" style="display: none;">
        <h1>Your Decks</h1>
        <button id="logout-btn">Log Out</button>
        <button id="start-review-btn">Start Review</button>

        <div id="new-deck-form">
            <input type="text" id="deck-name-input" placeholder="New deck name">
            <button id="create-deck-btn">Create Deck</button>
        </div>

        <ul id="decks-list"></ul>
    </div>

    <div id="deck-screen" style="display: none;">
        <button id="back-to-decks-btn">← Back to Decks</button>
        <h1 id="deck-screen-title"></h1>

        <div id="new-card-form">
            <input type="text" id="card-question-input" placeholder="Question">
            <input type="text" id="card-answer-input" placeholder="Answer">
            <button id="create-card-btn">Add Card</button>
        </div>

        <ul id="cards-list"></ul>
    </div>

    <div id="review-screen" style="display: none;">
        <button id="back-from-review-btn">← Back to Decks</button>
        <h1>Review</h1>

        <div id="review-card-area">
            <p id="review-progress"></p>
            <div id="review-card">
                <p id="review-question"></p>
                <p id="review-answer" style="display: none;"></p>
            </div>

            <button id="reveal-answer-btn">Reveal Answer</button>

            <div id="rating-buttons" style="display: none;">
                <button data-quality="0">Again</button>
                <button data-quality="3">Hard</button>
                <button data-quality="4">Good</button>
                <button data-quality="5">Easy</button>
            </div>
        </div>

        <div id="review-done" style="display: none;">
            <p>All done for today! 🎉</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
